* { margin:0; padding:0; box-sizing:border-box; }
body {

.wrap { width:100%; max-width:420px; padding:16px 16px 40px; position:relative; }
.back-link { display:block; text-align:center; font-family:'Fredoka One',cursive; font-size:12px; letter-spacing:2px; color:rgba(255,180,0,0.5); text-decoration:none; margin-bottom:8px; }
.title { font-family:'Fredoka One',cursive; font-size:26px; letter-spacing:4px; text-align:center; color:#fff; text-shadow:0 0 16px rgba(255,150,0,0.5); margin-bottom:4px; }
.subtitle { text-align:center; font-size:11px; color:rgba(255,200,150,0.4); font-weight:800; letter-spacing:1px; margin-bottom:14px; }

.top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
.top-row .back-link { margin-bottom:0; }
.settings-btn { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.07); border:1px solid rgba(255,180,0,0.25); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; transition:all .3s; flex-shrink:0; }
.settings-btn:hover { background:rgba(255,180,0,0.15); transform:rotate(45deg); }

#settings-panel { display:none; position:absolute; top:8px; left:8px; right:8px; background:linear-gradient(160deg,#180020,#0a0015); border:2px solid rgba(255,200,0,0.4); padding:20px 18px; z-index:100; border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,0.95); }
.panel-title { font-family:'Fredoka One',cursive; font-size:18px; letter-spacing:2px; text-align:center; margin-bottom:14px; color:#ffd700; }
.music-list { background:rgba(0,0,0,0.45); border:1px solid rgba(255,180,0,0.15); border-radius:12px; padding:4px; max-height:180px; overflow-y:auto; margin-bottom:10px; scrollbar-width:thin; }
.music-item { display:flex; align-items:center; padding:7px 10px; font-size:12px; font-weight:700; color:rgba(255,220,150,0.55); border-radius:8px; }

.music-item.active { color:#ffd700; background:rgba(255,100,0,0.12); }
.music-item label { flex-grow:1; cursor:pointer; }
.loop-checkbox { width:16px; height:16px; margin-left:8px; cursor:pointer; accent-color:#ff3300; }
.mute-toggle { padding:10px 14px; border-radius:10px; width:100%; font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; letter-spacing:1px; cursor:pointer; border:1px solid; margin-bottom:8px; transition:all .2s; }
.mute-toggle.on { background:rgba(46,125,50,0.2); color:#66bb6a; border-color:rgba(76,175,80,0.3); }
.mute-toggle.off { background:rgba(192,57,43,0.2); color:#ef5350; border-color:rgba(231,76,60,0.3); }
.btn-panel-close { width:100%; padding:9px; margin-top:4px; border-radius:12px; background:transparent; color:rgba(255,180,0,0.45); border:1px solid rgba(255,180,0,0.2); cursor:pointer; font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; letter-spacing:3px; }

#auth-section input {
    width:100%; padding:12px; margin-bottom:10px; border-radius:12px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,180,0,0.25);
    color:#fff; font-family:'Nunito',sans-serif; font-weight:800; outline:none; font-size:14px;
}
.btn-login {
    width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ff8800,#ffcc00); color:#1a0800;
    font-family:'Fredoka One',cursive; font-size:14px; letter-spacing:2px;
}

.balance-bar {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,180,0,0.2);
    border-radius:16px; padding:12px 16px; margin-bottom:14px;
}
.balance-bar .lab { font-size:10px; letter-spacing:2px; color:rgba(255,200,100,0.5); font-weight:900; }
.balance-bar .val { font-family:'Fredoka One',cursive; font-size:18px; color:#ffd700; }

.section-title { font-family:'Fredoka One',cursive; font-size:13px; letter-spacing:2px; color:rgba(255,200,100,0.7); margin:16px 0 8px; }

/* ---- gauge ---- */
.gauge-card {
    background:linear-gradient(160deg,#150022,#1c0030);
    border:2px solid rgba(255,150,0,0.25);
    border-radius:22px; padding:16px; text-align:center; margin-bottom:14px;
}
.gauge-percent { font-family:'Fredoka One',cursive; font-size:34px; color:#8effa1; text-shadow:0 0 14px rgba(120,255,120,0.5); margin-top:-8px; }
.gauge-percent.mid { color:#ffd94a; text-shadow:0 0 14px rgba(255,210,60,0.5); }
.gauge-percent.low { color:#ff5a5a; text-shadow:0 0 14px rgba(255,60,60,0.5); }
.gauge-label { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.35); font-weight:800; margin-bottom:2px; }
.needle { transform-origin:100px 100px; transition:transform 4.5s cubic-bezier(0.1,0.7,0.1,1); }
.needle.spinning { transition:none; }

/* ---- stake / target ---- */
.pick-row { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.pick-box {
    flex:1; background:rgba(255,255,255,0.04); border:2px dashed rgba(255,255,255,0.15);
    border-radius:16px; padding:12px; text-align:center; min-height:96px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
}
.pick-box.filled { border-style:solid; border-color:rgba(255,180,0,0.4); background:rgba(255,180,0,0.06); }
.pick-box .cap { font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.35); font-weight:900; margin-bottom:6px; }
.pick-box .emo { font-size:30px; }
.pick-box .nm { font-size:11px; font-weight:800; color:#fff; margin-top:4px; }
.pick-box .pr { font-family:'Fredoka One',cursive; font-size:13px; color:#ffd700; margin-top:2px; }
.pick-arrow { font-size:20px; color:rgba(255,255,255,0.3); }

/* ---- inventory grid ---- */
.inv-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.hat-tile {
    position:relative; aspect-ratio:1; border-radius:14px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.03); border:2px solid var(--c,#666); transition:all .15s;
}
.hat-tile.sel { background:rgba(255,215,0,0.14); box-shadow:0 0 0 2px #ffd700, 0 0 14px rgba(255,215,0,0.5); }
.hat-tile .emo { font-size:24px; }
.hat-tile .pr { font-size:9px; font-weight:900; color:#ffd700; margin-top:2px; }
.hat-tile .check { position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%; background:#ffd700; color:#1a0800; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.hat-tile .sell-btn { position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,0.65); border:1px solid rgba(77,255,150,0.6); color:#8effa1; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center; z-index:2; }
.hat-tile .sell-btn:active { background:rgba(77,255,150,0.3); }
.empty-inv { text-align:center; padding:24px 10px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:700; line-height:1.6; }
.empty-inv a { color:#ffd700; text-decoration:none; }

.stake-sum { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; font-size:12px; font-weight:800; color:rgba(255,255,255,0.5); }
.stake-sum b { color:#ffd700; font-family:'Fredoka One',cursive; font-size:15px; }

.warn { text-align:center; font-size:12px; font-weight:800; color:#ff5a5a; padding:8px; min-height:18px; }

.btn-upgrade {

    font-family:'Fredoka One',cursive; font-size:15px; letter-spacing:3px;

.btn-upgrade:active:not(:disabled) { transform:translateY(4px); box-shadow:0 2px 0 #8a4600; }

/* ---- modal (target picker & result) ---- */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:50; align-items:center; justify-content:center; padding:16px; }
.modal-overlay.open { display:flex; }
.modal-box { background:linear-gradient(160deg,#150022,#1c0030); border:2px solid rgba(255,180,0,0.3); border-radius:20px; padding:16px; width:100%; max-width:380px; max-height:80vh; overflow-y:auto; }
.modal-title { font-family:'Fredoka One',cursive; font-size:15px; text-align:center; color:#ffd700; margin-bottom:12px; }

.modal-close { width:100%; padding:10px; margin-top:4px; border-radius:12px; background:transparent; color:rgba(255,180,0,0.5); border:1px solid rgba(255,180,0,0.25); cursor:pointer; font-family:'Nunito',sans-serif; font-size:11px; font-weight:900; letter-spacing:2px; }

      <div class="emo">🎒</div>

    </div>
    <div class="pick-arrow">→</div>
    <div class="pick-box" id="target-box" onclick="openTargetPicker()">

      <div class="emo" id="target-emo">❓</div>
      <div class="nm" id="target-name">Выбрать</div>
      <div class="pr" id="target-price"></div>
    </div>
  </div>

  <div class="inv-grid" id="inv-grid"></div>

  <div class="stake-sum">

    <b id="stake-sum-2">0 АР</b>
  </div>

  <div class="warn" id="warn-text"></div>

  <button class="btn-upgrade" id="upgrade-btn" disabled onclick="doUpgrade()">🎩 ПРОКАЧАТЬ</button>
</div>

</div>

    <button class="btn-login" onclick="closeResult()">ОК</button>
  </div>
</div>

let currentTrackIdx=parseInt(localStorage.getItem('musicTrack')||'0');
let bgMusic=new Audio(playlist[currentTrackIdx] ? playlist[currentTrackIdx].file : '');
bgMusic.loop=localStorage.getItem('musicLoop')==='1';
let mOn=true;

function renderPlaylist(){
    document.getElementById('music-playlist').innerHTML=playlist.map((t,i)=>`
        <div class="music-item ${i===currentTrackIdx?'active':''}">
            <label onclick="playTrack(${i})">${t.name}</label>
            <input type="checkbox" class="loop-checkbox" id="loop-${i}" onclick="updateLoop(${i})" ${i===currentTrackIdx&&bgMusic.loop?'checked':''}>
        </div>`).join('');
}
function updateLoop(i){
    if(i===currentTrackIdx){
        bgMusic.loop=document.getElementById('loop-'+i).checked;
        localStorage.setItem('musicLoop',bgMusic.loop?'1':'0');
    }
}
function playTrack(i){
    bgMusic.pause();currentTrackIdx=i;
    localStorage.setItem('musicTrack',i);
    bgMusic.src=playlist[i].file;
    bgMusic.loop=document.getElementById('loop-'+i)?document.getElementById('loop-'+i).checked:false;
    localStorage.setItem('musicLoop',bgMusic.loop?'1':'0');
    if(mOn)bgMusic.play().catch(()=>{});
    renderPlaylist();
}
bgMusic.onended=()=>{ if(!bgMusic.loop) playTrack((currentTrackIdx+1)%playlist.length); };

function toggleSettings(e){ e.stopPropagation(); document.getElementById('settings-panel').style.display='block'; renderPlaylist(); }
function closePanels(){ const p=document.getElementById('settings-panel'); if(p) p.style.display='none'; }
function applyVolumes(){
    const mVol=document.getElementById('music-vol').value;
    bgMusic.volume=mOn?mVol:0;
    if(mOn)bgMusic.play().catch(()=>{}); else bgMusic.pause();
    document.getElementById('m-toggle').className=mOn?'mute-toggle on':'mute-toggle off';
    document.getElementById('m-toggle').textContent=mOn?'🎵 МУЗЫКА: ВКЛ':'🎵 МУЗЫКА: ВЫКЛ';
}
function toggleMute(){ mOn=!mOn; applyVolumes(); }

function toEmail(u){return u.toLowerCase().replace(/[^a-z0-9]/g,'_')+'@burmalda.app';}

function login(){
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value;
    if(!u||!p){ alert('Заполни ник и пароль'); return; }
    if(p.length<6){ alert('Пароль должен быть минимум 6 символов'); return; }
    const fp=p+'_Brm9!';
    const isAuthErr=c=>['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c);
    db.ref('usernames/'+u.toLowerCase()).once('value').then(snap=>{
        if(snap.exists()){
            auth.signInWithEmailAndPassword(toEmail(u),fp)
                .then(c=>{uid=c.user.uid;user=u;go();})
                .catch(e1=>{
                    if(!isAuthErr(e1.code)){ alert('Ошибка входа: '+e1.code); return; }
                    auth.signInWithEmailAndPassword(toEmail(u),p)
                        .then(c=>{c.user.updatePassword(fp).catch(()=>{});uid=c.user.uid;user=u;go();})
                        .catch(()=>alert('Неверный пароль!'));
                });
        } else {
            auth.createUserWithEmailAndPassword(toEmail(u),fp)
                .then(c=>{
                    uid=c.user.uid;user=u;
                    db.ref('usernames/'+u.toLowerCase()).set(uid);
                    db.ref('players/'+uid).set({username:String(u),balance:5,history:['Регистрация'],usedPromos:{}});
                    go();
                })
                .catch(e=>{
                    if(e.code==='auth/email-already-in-use'){
                        auth.signInWithEmailAndPassword(toEmail(u),fp)
                            .then(c=>{uid=c.user.uid;user=u;go();})
                            .catch(()=>alert('Ошибка входа'));
                    } else if(e.code==='auth/weak-password'){
                        alert('Слишком простой пароль (минимум 6 символов)');
                    } else if(e.code==='auth/invalid-email'){
                        alert('Ник должен содержать хотя бы одну букву или цифру');
                    } else {
                        alert('Ошибка регистрации: '+e.code);
                    }
                });
        }
    }).catch(err=>{
        alert('Не удалось связаться с базой данных: '+(err.code||err.message)+'.\\nЕсли ошибка "PERMISSION_DENIED" — нужно обновить Firebase Rules в консоли (тестовые правила истекают через 30 дней).');
    });
}

const _loadingDiv=document.createElement('div');
_loadingDiv.style.cssText='text-align:center;padding:40px;font-family:Fredoka One,cursive;font-size:16px;letter-spacing:3px;color:rgba(255,180,0,0.5);';
_loadingDiv.textContent='ЗАГРУЗКА...';
document.getElementById('auth-section').style.display='none';
document.getElementById('auth-section').parentNode.insertBefore(_loadingDiv,document.getElementById('auth-section'));

let sessionReady=false;

auth.onAuthStateChanged(fu=>{
    _loadingDiv.remove();
    if(sessionReady) return; // сессия уже поднята через login(), не мешаем повторной асинхронной проверкой
    if(fu){uid=fu.uid;
        db.ref('players/'+uid).once('value').then(s=>{
            if(sessionReady) return;
            if(s.exists()&&s.val().username){user=String(s.val().username);go();}
            else{document.getElementById('auth-section').style.display='block';}
        }).catch(err=>{
            if(sessionReady) return;
            document.getElementById('auth-section').style.display='block';
            alert('Не удалось загрузить профиль: '+(err.code||err.message));
        });
    } else {
        document.getElementById('auth-section').style.display='block';
    }
});

function go(){
    sessionReady=true;
    document.getElementById('auth-section').style.display='none';
    document.getElementById('game-section').style.display='block';
    applyVolumes(); renderPlaylist();
    localStorage.setItem('lobbyUser', user);
    localStorage.setItem('lobbyUid', uid);
    db.ref('players/'+uid).update({lastSeen:Date.now(),currentPage:'🎩 Апгрейд'});
    db.ref('players/'+uid).on('value', s=>{
        const d=s.val()||{};
        document.getElementById('balance').textContent=(d.balance||0)+' АР';
        inventory=Object.entries(d.hats||{}).map(([key,h])=>({key,...h}));
        // убираем из выбора то, чего больше нет
        stakeKeys=new Set([...stakeKeys].filter(k=>inventory.some(h=>h.key===k)));
        renderInventory();
        updateGauge();
    });
}

   ВАЖНО: этот каталог должен быть идентичен каталогу в index.html (те же id/картинки/названия/цены). */

    {id:'h1',name:'Оригинальная шляпа',img:'Zalypki/z1.jpg',rarity:'common',price:3},

    {id:'h14',name:'Алмазная шляпа',img:'Zalypki/z14.jpg',rarity:'legendary',price:1000},
    {id:'h15',name:'Драгоценная шляпа',img:'Zalypki/z15.jpg',rarity:'mythical',price:1500},
    {id:'h16',name:'Космическая шляпа',img:'Zalypki/z16.jpg',rarity:'mythical',price:3000,buyable:false}

function hatIcon(h,size){
    if(!h.img) return '<span style="display:inline-block;width:'+size+'px;height:'+size+'px;"></span>';
    return '<span style="display:inline-flex;width:'+size+'px;height:'+size+'px;overflow:hidden;border-radius:8px;align-items:center;justify-content:center;flex-shrink:0;">'
        +'<img src="'+h.img+'" alt="" width="'+size+'" height="'+size+'" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.visibility=\'hidden\'">'
        +'</span>';
}
function catalogOf(catalogId){ return HAT_CATALOG.find(h=>h.id===catalogId); }
const SELL_RATE=0.9; // возврат при продаже — 90% от цены покупки
const RARITY_COLORS={common:'#9e9e9e',uncommon:'#4caf50',rare:'#2196f3',epic:'#a855f7',legendary:'#ffb700',mythical:'#ff2255'};
const RARITY_NAMES={common:'Обычная',uncommon:'Необычная',rare:'Редкая',epic:'Эпическая',legendary:'Легендарная',mythical:'Мифическая'};
const HOUSE_EDGE=0.90; // 10% в пользу казино
const MAX_CHANCE=95;   // потолок шанса, чтобы гарантия была невозможна

let inventory=[];
let stakeKeys=new Set();
let target=null;

function renderInventory(){
    const grid=document.getElementById('inv-grid');
    document.getElementById('inv-count').textContent=inventory.length;
    if(!inventory.length){
        grid.innerHTML='<div class="empty-inv" style="grid-column:1/-1">У вас пока нет шляп.<br>Загляните в <a href="index.html">🛒 Магазин</a> на главной!</div>';
        return;
    }
    grid.innerHTML=inventory.map(h=>{
        const cat=catalogOf(h.catalogId)||h;
        const c=RARITY_COLORS[cat.rarity];
        const sel=stakeKeys.has(h.key);
        const sellPrice=Math.floor(h.price*SELL_RATE);
        return `<div class="hat-tile${sel?' sel':''}" style="--c:${c}" onclick="toggleStake('${h.key}')">
            ${sel?'<div class="check">✓</div>':''}
            <div class="sell-btn" title="Продать за ${sellPrice} АР" onclick="event.stopPropagation();sellHat('${h.key}')">💰</div>
            <div class="emo">${hatIcon(cat,30)}</div>
            <div class="pr">${h.price} АР</div>
        </div>`;
    }).join('');
}

function sellHat(key){
    const h=inventory.find(x=>x.key===key);
    if(!h) return;
    const refund=Math.floor(h.price*SELL_RATE);
    const cat=catalogOf(h.catalogId);
    if(!confirm('Продать «'+(cat?cat.name:'шляпу')+'» за '+refund+' АР?')) return;
    db.ref('players/'+uid).once('value').then(s=>{
        const d=s.val()||{};
        const updates={};
        updates['balance']=(d.balance||0)+refund;
        updates['hats/'+key]=null;
        updates['history']=(d.history||[]).concat(['💰 Продана шляпа: '+(cat?cat.name:'?')+' +'+refund+' АР']).slice(-50);
        db.ref('players/'+uid).update(updates);
    });
}

function toggleStake(key){
    if(stakeKeys.has(key)) stakeKeys.delete(key); else stakeKeys.add(key);
    renderInventory();
    updateGauge();
}

function stakeTotal(){
    return inventory.filter(h=>stakeKeys.has(h.key)).reduce((s,h)=>s+h.price,0);
}

function openTargetPicker(){
    const list=document.getElementById('target-list');
    list.innerHTML=HAT_CATALOG.map(h=>{
        const c=RARITY_COLORS[h.rarity];
        return `<div class="cat-item" style="--c:${c}" onclick="pickTarget('${h.id}')">
            <div class="emo">${hatIcon(h,22)}</div>
            <div><div class="nm">${h.name}</div><div class="rn">${RARITY_NAMES[h.rarity]}</div></div>
            <div class="pr">${h.price} АР</div>
        </div>`;
    }).join('');
    document.getElementById('target-modal').classList.add('open');
}
function closeTargetPicker(){ document.getElementById('target-modal').classList.remove('open'); }
function pickTarget(hatId){
    target=HAT_CATALOG.find(h=>h.id===hatId);
    document.getElementById('target-box').classList.add('filled');
    document.getElementById('target-emo').innerHTML=hatIcon(target,30);
    document.getElementById('target-name').textContent=target.name;
    document.getElementById('target-price').textContent=target.price+' АР';
    closeTargetPicker();
    updateGauge();
}

function updateGauge(){
    const total=stakeTotal();
    document.getElementById('stake-count-lbl').textContent=stakeKeys.size+' шляп';
    document.getElementById('stake-sum-lbl').textContent=total+' АР';
    document.getElementById('stake-sum-2').textContent=total+' АР';

    const btn=document.getElementById('upgrade-btn');
    const warn=document.getElementById('warn-text');
    let chance=0, ok=true, msg='';

    if(!stakeKeys.size){ ok=false; msg='Выбери хотя бы одну шляпу для ставки'; }
    else if(!target){ ok=false; msg='Выбери цель апгрейда'; }
    else if(total>=target.price){ ok=false; msg='🙅 Невыгодно! Ставка дороже (или равна) цели — так апгрейднуть нельзя.'; }
    else { chance=Math.min(MAX_CHANCE,(total/target.price)*100*HOUSE_EDGE); }

    warn.textContent=msg;
    btn.disabled=!ok;

    const pctText=document.getElementById('chance-text');
    pctText.textContent=chance.toFixed(2)+'%';
    pctText.className='gauge-percent '+(chance>=55?'':chance>=25?'mid':'low');

    const frac=chance/100;
    const circumference=2*Math.PI*82; // длина полной окружности ≈ 515.2
    document.getElementById('arc-fill').setAttribute('stroke-dasharray',(circumference*frac).toFixed(1)+' '+circumference.toFixed(1));
    const angle=frac*360; // 0% = стрелка вверх (12 часов), по часовой стрелке
    document.getElementById('needle').style.transform='rotate('+angle+'deg)';

    return {total,chance,ok};
}

function doUpgrade(){
    const state=updateGauge();
    if(!state.ok||!target) return;
    const btn=document.getElementById('upgrade-btn');
    btn.disabled=true;

    const roll=Math.random()*100;
    const win=roll<=state.chance;
    const landingAngle=(roll/100)*360;      // где стрелка окажется на круге (0-360°)
    const SPINS=4;                          // сколько полных кругов "намотать" перед остановкой
    const needle=document.getElementById('needle');

    // мгновенно ставим стрелку в текущую позицию без анимации, чтобы не было рывка назад
    needle.classList.add('spinning');
    void needle.offsetWidth;
    needle.classList.remove('spinning');

    // затем — долгий плавный поворот: 4 полных оборота + финальный угол.
    // cubic-bezier(0.1,0.7,0.1,1) даёт быстрый разгон в начале и долгое плавное торможение в конце (~4.5 сек).
    requestAnimationFrame(()=>{
        needle.style.transform='rotate('+(SPINS*360+landingAngle)+'deg)';
    });

    setTimeout(()=>finishUpgrade(win), 4700);
}

function finishUpgrade(win){
    const stakedHats=inventory.filter(h=>stakeKeys.has(h.key));
    db.ref('players/'+uid).once('value').then(s=>{
        const d=s.val()||{};
        const updates={};
        stakedHats.forEach(h=>{ updates['hats/'+h.key]=null; });
        let historyLine;
        if(win){
            const newKey=db.ref('players/'+uid+'/hats').push().key;
            updates['hats/'+newKey]={catalogId:target.id,price:target.price,ts:Date.now()};
            historyLine='🎩 Апгрейд ✅: '+stakedHats.length+' шляп → '+target.name;
        } else {
            historyLine='🎩 Апгрейд ❌: сгорело '+stakedHats.length+' шляп ('+stakedHats.reduce((s,h)=>s+h.price,0)+' АР)';
        }
        updates['history']=(d.history||[]).concat([historyLine]).slice(-50);
        db.ref('players/'+uid).update(updates).then(()=>{
            showResult(win);
            stakeKeys=new Set();
            target=null;
            document.getElementById('target-box').classList.remove('filled');
            document.getElementById('target-emo').textContent='❓';
            document.getElementById('target-name').textContent='Выбрать';
            document.getElementById('target-price').textContent='';
        });
    });
}

function showResult(win){
    document.getElementById('result-emo').textContent=win?'🎉':'💀';
    document.getElementById('result-emo').style.color=win?'#4dff7a':'#ff5a5a';
    document.getElementById('result-title').textContent=win?'Апгрейд успешен!':'Апгрейд провален';
    document.getElementById('result-desc').textContent=win
        ? 'Ты получил: '+target.name
        : 'Все поставленные шляпы сгорели. Бывает — в следующий раз повезёт больше.';
    document.getElementById('result-modal').classList.add('open');
}
function closeResult(){
    document.getElementById('result-modal').classList.remove('open');
    document.getElementById('upgrade-btn').disabled=false;
    updateGauge();
}

document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',()=>m.classList.remove('open')));
</script>
